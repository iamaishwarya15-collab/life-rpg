<!DOCTYPE html>
<html>
<head>
    <title>Life RPG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, serif;
            color: #f5edff;

            background:
                radial-gradient(circle at 15% 20%, rgba(140,90,210,.25), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(80,50,160,.25), transparent 35%),
                linear-gradient(135deg, #07050d, #160d27, #090611);
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .content {
            max-width: 750px;
        }

        .sword {
            font-size: 65px;
            text-shadow: 0 0 30px rgba(200,150,255,.7);
        }

        h1 {
            font-size: 64px;
            margin: 10px 0;
            letter-spacing: 7px;
            color: #ead8ff;
            text-shadow: 0 0 30px rgba(180,120,255,.5);
        }

        .tagline {
            font-size: 22px;
            color: #b7a8c8;
            line-height: 1.6;
            margin: 20px auto 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        a {
            text-decoration: none;
            padding: 15px 28px;
            border-radius: 13px;
            font-weight: bold;
            transition: .25s;
        }

        .primary {
            color: white;
            background: linear-gradient(90deg, #7046a5, #9b63d0);
            box-shadow: 0 8px 25px rgba(130,80,190,.25);
        }

        .secondary {
            color: #d8baf5;
            border: 1px solid rgba(210,170,255,.25);
            background: rgba(30,20,50,.7);
        }

        a:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(150,90,220,.3);
        }

        .features {
            margin-top: 55px;
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .feature {
            width: 150px;
            padding: 18px;
            border-radius: 16px;
            background: rgba(30,20,50,.55);
            border: 1px solid rgba(200,160,255,.12);
        }

        .feature div {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .feature span {
            color: #aaa0b5;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 42px;
                letter-spacing: 4px;
            }

            .tagline {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <section class="hero">

        <div class="content">

            <div class="sword">⚔️</div>

            <h1>LIFE RPG</h1>

            <p class="tagline">
                Turn your real-life goals into quests,
                earn XP, build your character,
                and level up your life.
            </p>

            <div class="buttons">

                <a class="primary" href="{% url 'signup' %}">
                    ✨ Begin Your Quest
                </a>

                <a class="secondary" href="{% url 'login' %}">
                    ⚔️ Enter the Realm
                </a>

            </div>

            <div class="features">

                <div class="feature">
                    <div>📜</div>
                    <span>Complete Quests</span>
                </div>

                <div class="feature">
                    <div>⭐</div>
                    <span>Earn XP</span>
                </div>

                <div class="feature">
                    <div>🪙</div>
                    <span>Earn Gold</span>
                </div>

                <div class="feature">
                    <div>🏆</div>
                    <span>Unlock Achievements</span>
                </div>

            </div>

        </div>

    </section>

</body>
</html>
